name: Build Defense Lab Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "tests/**"
      - "VERSION"
      - "manifest.json"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "tests/**"
      - "VERSION"
      - "manifest.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: defense-lab-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Run host frame tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror             -Ifirmware/include             tests/frame_logic_test.cpp             -o /tmp/defense-lab-tests
          /tmp/defense-lab-tests

      - name: Build ESP32 firmware
        run: pio run -e esp32dev

      - name: Enforce flash budget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path(".pio/build/esp32dev/firmware.bin")
          size = app.stat().st_size
          partition_limit = 1_310_720
          hard_limit = int(partition_limit * 0.90)
          print(f"Firmware: {size:,} bytes ({size/partition_limit:.1%} of app partition)")
          if size > hard_limit:
              raise SystemExit("Firmware exceeds the 90% app-partition safety budget.")
          PY

      - name: Prepare install images
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/esp32dev"
          WEB="docs/firmware"
          mkdir -p "$WEB"

          BOOT_APP="$BUILD/boot_app0.bin"
          if [ ! -f "$BOOT_APP" ]; then
            BOOT_APP="$(find ~/.platformio/packages -name boot_app0.bin -type f | head -n 1)"
          fi

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -f "$BOOT_APP"

          cp "$BUILD/bootloader.bin" "$WEB/bootloader.bin"
          cp "$BUILD/partitions.bin" "$WEB/partitions.bin"
          cp "$BOOT_APP" "$WEB/boot_app0.bin"
          cp "$BUILD/firmware.bin" "$WEB/firmware.bin"
          cp "$BUILD/firmware.bin" "$WEB/defense-lab-ota.bin"

          python -m esptool             --chip esp32 merge-bin             --flash-mode dio             --flash-size 4MB             --output "$WEB/defense-lab-full.bin"             0x1000 "$WEB/bootloader.bin"             0x8000 "$WEB/partitions.bin"             0xe000 "$WEB/boot_app0.bin"             0x10000 "$WEB/firmware.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: defense-lab-${{ github.ref_name }}-firmware
          path: |
            docs/firmware/defense-lab-full.bin
            docs/firmware/defense-lab-ota.bin
            docs/firmware/bootloader.bin
            docs/firmware/partitions.bin
            docs/firmware/boot_app0.bin
            docs/firmware/firmware.bin

      - name: Publish browser firmware for release commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/firmware/*.bin
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Defense Lab browser firmware [skip ci]"
          fi
          git pull --rebase origin main
          git push

      - name: Tag and publish immutable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION."
            exit 1
          fi

          git tag -a "$TAG" -m "ESP32 Wireless Defense Lab $TAG"
          git push origin "$TAG"

          sha256sum             docs/firmware/defense-lab-full.bin             docs/firmware/defense-lab-ota.bin             > docs/firmware/SHA256SUMS.txt

          NOTES=".github/releases/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG"               --verify-tag               --title "ESP32 Wireless Defense Lab $TAG"               --notes-file "$NOTES"               --latest               docs/firmware/defense-lab-full.bin               docs/firmware/defense-lab-ota.bin               docs/firmware/SHA256SUMS.txt
          else
            gh release create "$TAG"               --verify-tag               --title "ESP32 Wireless Defense Lab $TAG"               --generate-notes               --latest               docs/firmware/defense-lab-full.bin               docs/firmware/defense-lab-ota.bin               docs/firmware/SHA256SUMS.txt
          fi
