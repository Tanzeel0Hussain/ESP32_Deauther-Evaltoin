name: Build ESP32 Defense Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tests/**"
      - "platformio.ini"
      - "VERSION"
      - "manifest.json"
      - ".github/releases/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: defense-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned firmware tooling
        run: pip install "platformio==6.2.0" "esptool==5.4.0"

      - name: Run host detector tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/include \
            tests/detection_logic_test.cpp \
            -o /tmp/defense-tests
          /tmp/defense-tests

      - name: Enforce defensive-only maintained source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' SOURCE_FILES < <(
            find . -type f \
              \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.ino' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.sh' \) \
              -not -path './.git/*' \
              -not -path './.pio/*' \
              -print0
          )

          if grep --line-number --with-filename --fixed-string "esp_wifi_80211_tx" "${SOURCE_FILES[@]}"; then
            echo "::error::Raw 802.11 transmit/injection API found in maintained source."
            exit 1
          fi

          if grep --line-number --with-filename -E "capturedPass|evil[ _-]?twin|handshake capture|pmkid capture" "${SOURCE_FILES[@]}"; then
            echo "::error::Credential-harvesting/offensive implementation marker found in maintained source."
            exit 1
          fi

          echo "Defensive-only repository source guard passed."

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Check flash budget
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path(".pio/build/esp32dev/firmware.bin").stat().st_size
          limit = 1_310_720
          print(f"Firmware: {size:,} bytes ({size/limit:.1%} of app partition)")
          if size > int(limit * 0.90):
              raise SystemExit("Firmware exceeds 90% app-partition budget")
          PY

      - name: Prepare browser and release firmware
        shell: bash
        run: |
          set -euo pipefail

          BUILD=".pio/build/esp32dev"
          OUT="docs/firmware"
          mkdir -p "$OUT"

          BOOT_APP="$BUILD/boot_app0.bin"
          if [ ! -f "$BOOT_APP" ]; then
            BOOT_APP="$(find ~/.platformio/packages -name boot_app0.bin -type f | head -n 1)"
          fi

          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -n "$BOOT_APP"
          test -f "$BOOT_APP"

          cp "$BUILD/bootloader.bin" "$OUT/bootloader.bin"
          cp "$BUILD/partitions.bin" "$OUT/partitions.bin"
          cp "$BOOT_APP" "$OUT/boot_app0.bin"
          cp "$BUILD/firmware.bin" "$OUT/firmware.bin"
          cp "$BUILD/firmware.bin" "$OUT/esp32-defense-lab-app.bin"

          python -m esptool \
            --chip esp32 \
            merge-bin \
            --flash-mode dio \
            --flash-size 4MB \
            --output "$OUT/esp32-defense-lab-full.bin" \
            0x1000 "$OUT/bootloader.bin" \
            0x8000 "$OUT/partitions.bin" \
            0xe000 "$OUT/boot_app0.bin" \
            0x10000 "$OUT/firmware.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: esp32-defense-lab-${{ github.run_id }}-firmware
          path: |
            docs/firmware/esp32-defense-lab-full.bin
            docs/firmware/esp32-defense-lab-app.bin
            docs/firmware/bootloader.bin
            docs/firmware/partitions.bin
            docs/firmware/boot_app0.bin
            docs/firmware/firmware.bin

      - name: Publish browser firmware from exact built commit
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="${GITHUB_SHA}"
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"

          if [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::main moved after this release build started; refusing to publish binaries compiled from an older source commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f docs/firmware/*.bin

          if ! git diff --cached --quiet; then
            git commit -m "build: publish ESP32 Defense Lab browser firmware"
          fi

          PUBLISH_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "publish_sha=$PUBLISH_SHA" >> "$GITHUB_OUTPUT"

      - name: Tag and publish immutable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          PUBLISH_SHA="${{ steps.publish.outputs.publish_sha }}"

          if [ -z "$PUBLISH_SHA" ]; then
            echo "::error::No immutable publish SHA was produced."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must use semantic version format."
            exit 1
          fi

          git fetch --tags origin
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$PUBLISH_SHA" ]; then
            echo "::error::main moved before tagging; refusing to tag a different source/binary state."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Releases are immutable."
            exit 1
          fi

          git tag -a "$TAG" "$PUBLISH_SHA" -m "ESP32 Wireless Defense Lab $TAG"
          git push origin "$TAG"

          (
            cd docs/firmware
            sha256sum \
              esp32-defense-lab-full.bin \
              esp32-defense-lab-app.bin \
              > SHA256SUMS.txt
          )

          NOTES=".github/releases/$TAG.md"

          if [ -f "$NOTES" ]; then
            gh release create "$TAG" \
              --verify-tag \
              --title "ESP32 Wireless Defense Lab $TAG" \
              --notes-file "$NOTES" \
              --latest \
              docs/firmware/esp32-defense-lab-full.bin \
              docs/firmware/esp32-defense-lab-app.bin \
              docs/firmware/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "ESP32 Wireless Defense Lab $TAG" \
              --generate-notes \
              --latest \
              docs/firmware/esp32-defense-lab-full.bin \
              docs/firmware/esp32-defense-lab-app.bin \
              docs/firmware/SHA256SUMS.txt
          fi
