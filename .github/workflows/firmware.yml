name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tests/**"
      - "platformio.ini"
      - "VERSION"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/**"
      - "platformio.ini"
      - "VERSION"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defense-lab-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run host detector tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include tests/detector_logic_test.cpp -o /tmp/defense-tests
          /tmp/defense-tests
      - name: Build default firmware
        run: pio run -e esp32dev
      - name: Build optional OLED firmware
        run: pio run -e esp32dev_oled
      - name: Enforce flash budget
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path(".pio/build/esp32dev/firmware.bin")
          size = app.stat().st_size
          limit = 1_310_720
          print(f"Firmware binary: {size:,} bytes ({size/limit:.1%} of app partition)")
          if size > int(limit * 0.90):
              raise SystemExit("Firmware exceeds the 90% app-partition budget.")
          PY
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: defense-lab-firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev_oled/firmware.bin
